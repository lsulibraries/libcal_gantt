libcal_gantt.settings:
  type: config_object
  label: 'LibCal Gantt Timeline settings'
  mapping:
    host:
      type: string
      label: 'LibCal host'
    client_id:
      type: string
      label: 'Client ID'
    client_secret:
      type: string
      label: 'Client secret'
    calendars:
      type: text
      label: 'Calendars'
    weekday_count:
      type: integer
      label: 'Number of weekdays to display'
    event_limit:
      type: integer
      label: 'Max events per calendar request'
    cache_ttl:
      type: integer
      label: 'Cache lifetime in seconds'
    timezone:
      type: string
      label: 'Timezone'
    day_start_hour:
      type: integer
      label: 'Day start hour'
    day_end_hour:
      type: integer
      label: 'Day end hour'
    hours_feed_url:
      type: string
      label: 'Hours feed URL'
    hours_cache_ttl:
      type: integer
      label: 'Hours cache lifetime in seconds'
    campus_rows:
      type: text
      label: 'Location rows'
    online_row_label:
      type: string
      label: 'Online events row label'
    online_location_keywords:
      type: string
      label: 'Online location keywords'
    # A string rather than a uri: the value is allowed to be a
    # root-relative path (/events) as well as an absolute URL, and the
    # uri type would reject the former.
    full_calendar_url:
      type: string
      label: 'Full calendar URL'
    campus_hours_feed_urls:
      type: sequence
      label: 'Per-row hours feed URLs'
      sequence:
        type: string
        label: 'Hours feed URL'
    campus_hours_lids:
      type: sequence
      label: 'Per-row hours feed location IDs (lid)'
      sequence:
        type: integer
        label: 'Location ID (lid)'
    show_weather:
      type: boolean
      label: 'Show daily weather'
    # Strings, not floats. A float coerces an empty field to 0.0, which is a
    # real point NWS will happily forecast for (the Gulf of Guinea); as
    # strings, "not configured" stays distinguishable from "the equator" and
    # WeatherClient::coordinate() can reject it.
    weather_lat:
      type: string
      label: 'Forecast latitude'
    weather_lon:
      type: string
      label: 'Forecast longitude'
    weather_contact:
      type: string
      label: 'Weather API contact address'
    weather_cache_ttl:
      type: integer
      label: 'Weather cache lifetime in seconds'
    show_on_this_day:
      type: boolean
      label: 'Show Wikipedia "On this day" facts on empty homepage days'
    on_this_day_cache_ttl:
      type: integer
      label: '"On this day" cache lifetime in seconds'

# Per-block-instance DISPLAY settings, as opposed to the feed settings
# above. Split this way so the same LibCal feed can be placed twice - a
# homepage teaser and a full grid on the events page - with independent
# presentation. Without this schema entry Drupal reports the block config
# as untyped, which fails the strict-config test and breaks translation of
# the values.
block.settings.libcal_gantt_chart:
  type: block_settings
  label: 'LibCal Events Gantt Chart block'
  mapping:
    render_mode:
      type: string
      label: 'Display style'
    chart_title:
      type: label
      label: 'Heading'
    homepage_days:
      type: integer
      label: 'Days shown before "Show more"'
    full_calendar_url:
      type: string
      label: 'Full calendar URL'
    show_legend:
      type: boolean
      label: 'Show legend'
    theme:
      type: string
      label: 'Theme'
    allow_theme_toggle:
      type: boolean
      label: 'Show light/dark toggle to visitors'

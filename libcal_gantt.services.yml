services:
  logger.channel.libcal_gantt:
    parent: logger.channel_base
    arguments: ['libcal_gantt']

  libcal_gantt.client:
    class: Drupal\libcal_gantt\Service\LibCalClient
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@cache.default'
      - '@datetime.time'
      - '@logger.channel.libcal_gantt'

  # Same five dependencies as the LibCal client, on purpose: the forecast is
  # fetched, cached and logged exactly like the Hours feed, just against a
  # different host. It shares the logger channel too, so a weather failure
  # shows up in the same place an events failure does.
  libcal_gantt.weather:
    class: Drupal\libcal_gantt\Service\WeatherClient
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@cache.default'
      - '@datetime.time'
      - '@logger.channel.libcal_gantt'

  # Same five dependencies again, for the same reason as the weather: the
  # "On this day" facts are fetched, cached and logged exactly like the
  # other two external feeds, and share the same logger channel.
  libcal_gantt.on_this_day:
    class: Drupal\libcal_gantt\Service\OnThisDayClient
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@cache.default'
      - '@datetime.time'
      - '@logger.channel.libcal_gantt'
